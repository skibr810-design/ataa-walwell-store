
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم عطاء ولويل</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101114;color:#fff;font-family:Tahoma,Arial}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0;border-radius:8px;padding:12px;background:#ff633d;color:white}
button:disabled{opacity:.5;cursor:not-allowed}
input,textarea,select{width:100%;padding:12px;background:#24252a;color:white;border:1px solid #444;border-radius:8px;margin:7px 0 14px}
.wrap{max-width:1100px;margin:auto;padding:22px}
.panel{background:#1b1c20;border:1px solid #333;border-radius:12px;padding:20px;margin:16px 0}
h1,h2{color:#ff633d}
.hidden{display:none!important}
.product{padding:15px;background:#25262b;border-radius:10px;margin:12px 0}
.product img{width:100%;max-height:200px;object-fit:contain}
.product video{width:100%;max-height:250px}
.danger{background:#b83232}
.secondary{background:#555}
#status{color:#ffc09e;white-space:pre-wrap}
label{display:block}
.check{display:flex;align-items:center;gap:8px}
.check input{width:auto;margin:8px}
</style>
</head>
<body>
<div class="wrap">

<div id="login" class="panel">
<h1>عطاء ولويل</h1>
<h2>دخول المدير</h2>
<label>البريد الإلكتروني</label>
<input id="email" type="email" placeholder="بريد المدير">
<label>كلمة المرور</label>
<input id="password" type="password" placeholder="كلمة المرور">
<button id="loginBtn">تسجيل الدخول</button>
<p id="loginMsg"></p>
</div>

<div id="dashboard" class="hidden">
<h1>لوحة تحكم عطاء ولويل</h1>
<p>إدارة المتجر والمنتجات والأقسام</p>
<button id="logoutBtn" class="secondary">تسجيل الخروج</button>
<p id="status"></p>

<div class="panel">
<h2 id="formTitle">إضافة منتج جديد</h2>
<input type="hidden" id="editId">

<label>اسم المنتج</label>
<input id="name" placeholder="اسم المنتج">

<label>وصف المنتج</label>
<textarea id="description" placeholder="وصف المنتج"></textarea>

<label>السعر بالشيكل</label>
<input id="price" type="number" min="0" step="0.01">

<label>القسم</label>
<select id="category">
<option value="">بدون قسم</option>
</select>

<label>صورة المنتج</label>
<input id="photo" type="file" accept="image/*">

<label>فيديو المنتج (اختياري)</label>
<input id="video" type="file" accept="video/*">

<label class="check">
<input id="isNew" type="checkbox"> وصل حديثاً
</label>

<label class="check">
<input id="isOffer" type="checkbox"> عرض خاص
</label>

<button id="saveProductBtn">حفظ المنتج</button>
<button id="cancelEditBtn" class="secondary hidden">إلغاء التعديل</button>
</div>

<div class="panel">
<h2>إضافة قسم جديد</h2>
<input id="categoryName" placeholder="اسم القسم">
<button id="addCategoryBtn">إضافة القسم</button>
<div id="categoriesList"></div>
</div>

<div class="panel">
<h2>المنتجات الموجودة</h2>
<div id="productsList"></div>
</div>
</div>
</div>

<script>
const SUPABASE_URL="https://bjjlmeceuyehtdsvmjvt.supabase.co";

// ضع مفتاح Publishable الذي نسخته من Supabase هنا
const SUPABASE_ANON_KEY="sb_publishable_yY3tCS7726754hkP8sCdaw_ySbXgKyh";

const db=window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_ANON_KEY
);

const $=id=>document.getElementById(id);

const statusBox=$("status");

function message(text){
 statusBox.textContent=text;
}

function loginMessage(text){
 $("loginMsg").textContent=text;
}

async function checkAdmin(){
 const {data:{session},error}=await db.auth.getSession();

 if(error){
  loginMessage(error.message);
  return;
 }

 if(!session)return;

 const user=session.user;

 if(user.app_metadata?.role!=="admin"){
  await db.auth.signOut();
  loginMessage("الحساب لا يملك صلاحيات المدير. يجب تفعيل صلاحية admin.");
  return;
 }

 $("login").classList.add("hidden");
 $("dashboard").classList.remove("hidden");

 await loadCategories();
 await loadProducts();
}

async function login(){
 const email=$("email").value.trim();
 const password=$("password").value;

 if(!email||!password){
  loginMessage("أدخل البريد الإلكتروني وكلمة المرور");
  return;
 }

 $("loginBtn").disabled=true;
 loginMessage("جاري تسجيل الدخول...");

 const {error}=await db.auth.signInWithPassword({
  email,
  password
 });

 $("loginBtn").disabled=false;

 if(error){
  loginMessage("تعذر تسجيل الدخول: "+error.message);
  return;
 }

 await checkAdmin();
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

async function uploadFile(file,folder){
 if(!file)return null;

 const safeExtension=(file.name.split(".").pop()||"bin")
  .toLowerCase()
  .replace(/[^a-z0-9]/g,"");

 const path=folder+"/"+crypto.randomUUID()+"."+
  (safeExtension||"bin");

 const {error}=await db.storage
  .from("products-media")
  .upload(path,file,{upsert:false});

 if(error)throw error;

 const {data}=db.storage
  .from("products-media")
  .getPublicUrl(path);

 return data.publicUrl;
}

async function loadCategories(){
 const {data,error}=await db
  .from("categories")
  .select("*")
  .order("sort_order");

 if(error){
  message("خطأ في الأقسام: "+error.message);
  return;
 }

 $("category").innerHTML=
  '<option value="">بدون قسم</option>';

 $("categoriesList").innerHTML="";

 data.forEach(c=>{
  $("category").add(new Option(c.name,c.id));

  const item=document.createElement("div");
  item.className="product";

  const title=document.createElement("span");
  title.textContent=c.name;

  const edit=document.createElement("button");
  edit.className="secondary";
  edit.textContent="تعديل الاسم";
  edit.onclick=()=>editCategory(c.id,c.name);

  const del=document.createElement("button");
  del.className="danger";
  del.textContent="حذف القسم";
  del.onclick=()=>deleteCategory(c.id);

  item.append(title,edit,del);
  $("categoriesList").append(item);
 });
}

async function addCategory(){
 const value=$("categoryName").value.trim();

 if(!value)return alert("اكتب اسم القسم");

 const {error}=await db
  .from("categories")
  .insert({name:value});

 if(error)return alert(error.message);

 $("categoryName").value="";
 await loadCategories();
 message("تم إضافة القسم بنجاح");
}

async function editCategory(id,currentName){
 const value=prompt("اكتب الاسم الجديد للقسم:",currentName);
 if(value===null)return;
 const name=value.trim();
 if(!name)return alert("اسم القسم لا يمكن أن يكون فارغاً");
 const {error}=await db.from("categories").update({name}).eq("id",id);
 if(error)return alert("تعذر تعديل القسم: "+error.message);
 await loadCategories();
 message("تم تعديل اسم القسم بنجاح");
}

async function deleteCategory(id){
 if(!confirm("هل تريد حذف هذا القسم؟"))return;

 const {error}=await db
  .from("categories")
  .delete()
  .eq("id",id);

 if(error)return alert(error.message);

 await loadCategories();
 await loadProducts();
}

function resetForm(){
 $("editId").value="";
 $("name").value="";
 $("description").value="";
 $("price").value="";
 $("category").value="";
 $("photo").value="";
 $("video").value="";
 $("isNew").checked=false;
 $("isOffer").checked=false;
 $("formTitle").textContent="إضافة منتج جديد";
 $("saveProductBtn").textContent="حفظ المنتج";
 $("cancelEditBtn").classList.add("hidden");
}

async function saveProduct(){
 try{
  const id=$("editId").value;
  const name=$("name").value.trim();
  const priceValue=$("price").value;

  if(!name||priceValue===""){
   return alert("أدخل اسم المنتج والسعر");
  }

  const price=Number(priceValue);

  if(!Number.isFinite(price)||price<0){
   return alert("السعر غير صحيح");
  }

  $("saveProductBtn").disabled=true;
  message("جاري حفظ المنتج...");

  const record={
   name,
   description:$("description").value,
   price,
   category_id:$("category").value||null,
   is_new:$("isNew").checked,
   is_offer:$("isOffer").checked,
   active:true
  };

  const imageFile=$("photo").files[0];
  const videoFile=$("video").files[0];

  if(imageFile){
   if(imageFile.size>10*1024*1024)
    throw new Error("حجم الصورة يجب ألا يتجاوز 10 ميغابايت");

   record.image_url=await uploadFile(imageFile,"images");
  }

  if(videoFile){
   if(videoFile.size>50*1024*1024)
    throw new Error("حجم الفيديو يجب ألا يتجاوز 50 ميغابايت");

   record.video_url=await uploadFile(videoFile,"videos");
  }

  let result;

  if(id){
   result=await db.from("products")
    .update(record).eq("id",id);
  }else{
   result=await db.from("products")
    .insert(record);
  }

  if(result.error)throw result.error;

  resetForm();
  message(id?"تم تعديل المنتج بنجاح":"تم إضافة المنتج بنجاح");
  await loadProducts();

 }catch(e){
  message("حدث خطأ: "+e.message);
 }finally{
  $("saveProductBtn").disabled=false;
 }
}

async function loadProducts(){
 const {data,error}=await db
  .from("products")
  .select("*")
  .order("created_at",{ascending:false});

 if(error){
  message("خطأ في تحميل المنتجات: "+error.message);
  return;
 }

 $("productsList").innerHTML="";

 data.forEach(p=>{
  const item=document.createElement("div");
  item.className="product";

  const title=document.createElement("h3");
  title.textContent=p.name;

  const desc=document.createElement("p");
  desc.textContent=p.description||"";

  const price=document.createElement("strong");
  price.textContent=p.price+" شيكل";

  item.append(title,desc,price);

  if(p.image_url){
   const img=document.createElement("img");
   img.src=p.image_url;
   img.alt=p.name;
   item.append(img);
  }

  if(p.video_url){
   const video=document.createElement("video");
   video.src=p.video_url;
   video.controls=true;
   item.append(video);
  }

  const edit=document.createElement("button");
  edit.textContent="تعديل المنتج";
  edit.className="secondary";
  edit.onclick=()=>editProduct(p);

  const del=document.createElement("button");
  del.textContent="حذف المنتج";
  del.className="danger";
  del.onclick=()=>deleteProduct(p.id);

  item.append(edit,del);
  $("productsList").append(item);
 });
}

function editProduct(p){
 $("editId").value=p.id;
 $("name").value=p.name;
 $("description").value=p.description||"";
 $("price").value=p.price;
 $("category").value=p.category_id||"";
 $("isNew").checked=p.is_new;
 $("isOffer").checked=p.is_offer;

 $("formTitle").textContent="تعديل المنتج";
 $("saveProductBtn").textContent="حفظ التعديلات";
 $("cancelEditBtn").classList.remove("hidden");

 window.scrollTo({top:0,behavior:"smooth"});
}

async function deleteProduct(id){
 if(!confirm("هل تريد حذف المنتج؟"))return;

 const {error}=await db
  .from("products")
  .delete()
  .eq("id",id);

 if(error)return alert(error.message);

 await loadProducts();
 message("تم حذف المنتج");
}

$("loginBtn").addEventListener("click",login);
$("logoutBtn").addEventListener("click",logout);
$("saveProductBtn").addEventListener("click",saveProduct);
$("addCategoryBtn").addEventListener("click",addCategory);
$("cancelEditBtn").addEventListener("click",resetForm);

checkAdmin();
</script>
</body>
</html>
