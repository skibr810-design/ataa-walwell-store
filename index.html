
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عطاء ولويل | كماليات السيارات</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#101114;color:#fff;font-family:Tahoma,Arial,sans-serif}
header{background:#191a1e;padding:22px 7%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333}
.logo{font-size:27px;font-weight:bold;color:#ff633d}
header a{color:white;text-decoration:none}
.hero{padding:75px 8%;text-align:center;background:linear-gradient(120deg,#252629,#101114)}
.hero h1{font-size:38px;margin:0 0 15px}
.hero h1 span{color:#ff633d}
.hero p{color:#bbb;line-height:2}
.btn{display:inline-block;background:#ff633d;color:white;padding:13px 25px;border-radius:8px;text-decoration:none;margin-top:15px}
section{padding:35px 7%}
h2{border-right:4px solid #ff633d;padding-right:12px}
.categories{display:flex;flex-wrap:wrap;gap:10px}
.category{background:#24252a;border:1px solid #444;color:white;padding:12px 18px;border-radius:8px;cursor:pointer}
.category.active{background:#ff633d;border-color:#ff633d}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px}
.product{background:#1c1d21;border:1px solid #333;border-radius:12px;overflow:hidden}
.product img{width:100%;height:190px;object-fit:cover;background:#292929}
.product video{width:100%;max-height:220px;background:#000}
.product-info{padding:16px}
.product h3{margin:0 0 10px}
.product-info p{color:#bbb;line-height:1.8}
.price{color:#ff633d;font-size:20px;font-weight:bold}
.order{display:block;text-align:center;background:#188b4d;color:white;text-decoration:none;padding:12px;border-radius:7px;margin-top:15px}
.empty,.loading,.error{color:#bbb;text-align:center;padding:25px;line-height:2}
.error{color:#ff947d}
footer{text-align:center;background:#191a1e;padding:25px;color:#aaa;margin-top:40px}
footer .logo{margin-bottom:12px}
.posts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.post{background:#1c1d21;border:1px solid #333;border-radius:12px;padding:16px}.post img{width:100%;max-height:220px;object-fit:cover;border-radius:8px}
</style>
</head>

<body>

<header>
  <div class="logo">عطاء ولويل</div>
  <a href="#products">منتجاتنا</a>
</header>

<div class="hero">
  <h1>عالمك في <span>كماليات السيارات</span></h1>
  <p>اكتشف أجمل الإكسسوارات والكماليات لسيارتك<br>جودة وأناقة في مكان واحد</p>
  <a class="btn" href="#products">اكتشف منتجاتنا</a>
</div>

<section id="announcements" class="hidden"><h2>الإعلانات والمنشورات</h2><div id="postsList" class="posts"></div></section>

<section>
  <h2>أقسام المتجر</h2>
  <div class="categories" id="categories">
    <p class="loading">جاري تحميل الأقسام...</p>
  </div>
</section>

<section id="products">
  <h2>منتجاتنا</h2>
  <div class="products" id="productsList">
    <p class="loading">جاري تحميل المنتجات...</p>
  </div>
</section>

<footer>
  <div class="logo">عطاء ولويل</div>
  <p>عالمك في كماليات السيارات</p>
  <p>للطلب والاستفسار: 0568077000</p>
</footer>

<script>
const SUPABASE_URL = "https://bjjlmeceuyehtdsvmjvt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_yY3tCS7726754hkP8sCdaw_ySbXgKyh";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const phone = "970568077000";

const categoriesElement = document.getElementById("categories");
const productsElement = document.getElementById("productsList");

let categories = [];
let products = [];
let selected = "الكل";

function createElement(tag, className, text) {
  const element = document.createElement(tag);

  if (className) element.className = className;
  if (text !== undefined) element.textContent = text;

  return element;
}

function renderCategories() {
  categoriesElement.replaceChildren();

  const filters = [
    {id:"الكل", name:"الكل"},
    ...categories.map(c => ({id:c.id, name:c.name})),
    {id:"__new__", name:"وصل حديثاً"},
    {id:"__offers__", name:"العروض"}
  ];

  filters.forEach(category => {
    const button = createElement("button", "category", category.name);

    if (String(selected) === String(category.id)) {
      button.classList.add("active");
    }

    button.addEventListener("click", () => {
      selected = category.id;
      renderCategories();
      renderProducts();
    });

    categoriesElement.appendChild(button);
  });
}

function renderProducts() {
  productsElement.replaceChildren();

  let filtered = products;

  if (selected === "__new__") {
    filtered = products.filter(p => p.is_new === true);
  } else if (selected === "__offers__") {
    filtered = products.filter(p => p.is_offer === true);
  } else if (selected !== "الكل") {
    filtered = products.filter(
      p => String(p.category_id) === String(selected)
    );
  }

  if (!filtered.length) {
    productsElement.appendChild(
      createElement("p", "empty", "لا توجد منتجات في هذا القسم حالياً.")
    );
    return;
  }

  filtered.forEach(product => {
    const card = createElement("div", "product");
    const image = createElement("img");

    image.src = product.image_url ||
      "https://placehold.co/500x400/24252a/ffffff?text=Ataa+Walwell";

    image.alt = product.name || "منتج";
    image.loading = "lazy";

    image.onerror = () => {
      image.src = "https://placehold.co/500x400/24252a/ffffff?text=Ataa+Walwell";
    };

    const info = createElement("div", "product-info");
    const name = createElement("h3", "", product.name || "منتج");
    const description = createElement(
      "p",
      "",
      product.description || ""
    );

    const price = createElement(
      "div",
      "price",
      `${product.price ?? 0} شيكل`
    );

    info.append(name);

    if (product.is_new) {
      info.append(createElement("p", "", "وصل حديثاً"));
    }

    if (product.is_offer) {
      info.append(createElement("p", "", "عرض خاص"));
    }

    info.append(description, price);

    if (product.video_url) {
      const video = createElement("video");
      video.src = product.video_url;
      video.controls = true;
      video.preload = "metadata";
      card.append(image, video);
    } else {
      card.append(image);
    }

    const orderPhone = window.storeWhatsapp || phone;
    const message = encodeURIComponent(
      `مرحباً، أريد طلب: ${product.name}\nالسعر: ${product.price} شيكل`
    );

    const order = createElement("a", "order", "اطلب عبر واتساب");
    order.href = `https://wa.me/${orderPhone}?text=${message}`;
    order.target = "_blank";
    order.rel = "noopener noreferrer";

    info.append(order);
    card.append(info);
    productsElement.append(card);
  });
}

async function loadPublicContent(){
  try{
    const {data,error}=await db.from("store_settings").select("settings").eq("id",1).maybeSingle();
    if(!error && data?.settings){
      const s=data.settings;
      if(s.store_name){document.title=s.store_name+" | كماليات السيارات";document.querySelectorAll(".logo").forEach(el=>el.textContent=s.store_name)}
      if(s.headline){const h=document.querySelector(".hero h1");h.textContent=s.headline}
      if(s.subtitle){const p=document.querySelector(".hero p");p.textContent=s.subtitle}
      if(s.accent){document.documentElement.style.setProperty("--accent",s.accent);document.querySelectorAll(".logo,.hero h1 span,.price,h2").forEach(el=>el.style.color=s.accent);document.querySelectorAll(".btn,.category.active").forEach(el=>el.style.background=s.accent)}
      if(s.whatsapp)window.storeWhatsapp=String(s.whatsapp).replace(/\D/g,"");
      if(s.cover_url){document.querySelector(".hero").style.backgroundImage="linear-gradient(120deg,rgba(20,20,22,.82),rgba(16,17,20,.9)),url("+JSON.stringify(s.cover_url)+")";document.querySelector(".hero").style.backgroundSize="cover";document.querySelector(".hero").style.backgroundPosition="center"}
    }
  }catch(e){console.warn("Store settings unavailable",e)}
  try{
    const {data,error}=await db.from("store_posts").select("*").eq("active",true).order("created_at",{ascending:false});
    if(error) return;
    const list=document.getElementById("postsList");
    (data||[]).forEach(p=>{
      const card=createElement("article","post");
      if(p.image_url){const img=createElement("img");img.src=p.image_url;img.alt=p.title||"إعلان";card.append(img)}
      card.append(createElement("h3","",p.title||""));
      if(p.body)card.append(createElement("p","",p.body));
      list.append(card);
    });
    if(list.children.length)document.getElementById("announcements").classList.remove("hidden");
  }catch(e){console.warn("Posts unavailable",e)}
}

async function loadStore() {
  categoriesElement.replaceChildren(
    createElement("p", "loading", "جاري تحميل الأقسام...")
  );

  productsElement.replaceChildren(
    createElement("p", "loading", "جاري تحميل المنتجات...")
  );

  try {
    const [categoriesResult, productsResult] = await Promise.all([
      db.from("categories")
        .select("*")
        .eq("active", true)
        .order("sort_order"),

      db.from("products")
        .select("*")
        .eq("active", true)
        .order("created_at", {ascending:false})
    ]);

    if (categoriesResult.error) throw categoriesResult.error;
    if (productsResult.error) throw productsResult.error;

    categories = categoriesResult.data || [];
    products = productsResult.data || [];

    renderCategories();
    renderProducts();

  } catch (error) {
    console.error("Store loading error:", error);

    categoriesElement.replaceChildren(
      createElement("p", "error", "تعذر تحميل الأقسام.")
    );

    productsElement.replaceChildren(
      createElement(
        "p",
        "error",
        "تعذر تحميل المنتجات. تأكد من صلاحيات القراءة في Supabase (RLS)."
      )
    );
  }
}

loadPublicContent();
loadStore();
</script>

</body>
</html>
